name: Python

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # patch-coverage PR comment

jobs:
  # The shared workflow starts coverage before pytest imports its plugins, which this
  # package is one of, so its module-level code is measured.
  python:
    uses: svaningelgem/ci-workflows/.github/workflows/python.yml@feat/optional-pylint-ty
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run consistency checks between stub & module
        env:
          PYTHONPATH: "."
        run: uv run stubtest logprise

      - name: Running mypy
        env:
          PYTHONPATH: "."
        # pyproject excludes .pyi from discovery so this checks the implementation, not the stub
        # that would otherwise shadow it; stubtest above covers the stub.
        run: uv run mypy .
