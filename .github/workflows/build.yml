name: Build and Test
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.10
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff format check
        run: uv run ruff format --check --diff .

      - name: Run ruff lint check
        run: uv run ruff check --diff .

      - name: Run consistency checks between stub & module
        env:
          PYTHONPATH: "."
        run: uv run stubtest logprise

      - name: Running mypy
        env:
          PYTHONPATH: "."
        run: uv run mypy .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        # Use `coverage run` (not pytest-cov) so measurement starts before pytest
        # imports the logprise package and its pytest plugin, capturing their
        # module-level definitions too.
        run: |
          uv run coverage run -m pytest
          uv run coverage xml

      - name: Upload coverage report
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}