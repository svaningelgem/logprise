name: Publish to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}  # Extract the tag (e.g., v1.0.0 or V2.3.4)
          VERSION=${VERSION#v}              # Remove 'v' prefix if present
          VERSION=${VERSION#V}              # Remove 'V' prefix if present
          echo "Setting version to $VERSION"
          uv version $VERSION

      - name: Run ruff format check
        if: always()
        run: uv run ruff format --check --diff .

      - name: Run ruff lint check
        if: always()
        run: uv run ruff check --no-fix .

      - name: Run consistency checks between stub & module
        if: always()
        env:
          PYTHONPATH: "."
        run: uv run stubtest ${{ github.event.repository.name }}

      - name: Running mypy
        if: always()
        env:
          PYTHONPATH: "."
        run: uv run mypy logprise/__init__.py logprise/pytest_plugin.py

      - name: Run tests with coverage
        if: always()
        # Use `coverage run` (not pytest-cov) so measurement starts before pytest
        # imports the package and its pytest plugin, capturing their module-level
        # definitions too.
        run: |
          uv run coverage run -m pytest
          uv run coverage xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build packages
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
